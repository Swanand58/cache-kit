# cachekit configuration. Every key is optional; values shown are the defaults.

ttl = "5m"                       # "5m" or "1h": TTL on breakpoints cachekit adds

[tokens]
count = "estimate"               # "estimate" (chars/4) or "api" (one count_tokens call to calibrate; library mode only)

[log]
path = "~/.cachekit/log.jsonl"   # JSONL, one line per call. Hashes and counts only; never prompts or API keys
quiet = false                    # true: no per-call summary line on stderr

[proxy]
port = 8787
upstream = "https://api.anthropic.com"
optimize = false                 # false: observe-only, requests forwarded byte-for-byte. true: rewrite (see README)
session_header = "x-claude-code-session-id"   # else session = hash(system prompt + first user message)

[keepalive]
enabled = false                  # opt-in. Replays the last request with max_tokens 0 shortly before the TTL expires
margin_seconds = 30              # refresh this long before expiry
max_refreshes = 12               # hard cap; it also stops once refreshes cost more than one re-write

[compact]
keep_last = 4                    # messages History.compact() keeps verbatim

# Prices are USD per million tokens. min_tokens = smallest cacheable prefix for the model.
# cache_write_5m / cache_write_1h default to 1.25x / 2x of `input`.
# Add or override any model:
#
# [models."claude-sonnet-5-5"]
# min_tokens = 512
# input = 2.0
# output = 10.0
# cache_read = 0.2
