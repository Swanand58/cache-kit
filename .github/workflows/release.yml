name: Release
# Actions -> Release -> Run workflow -> type the version (e.g. 0.1.2, no "v"). Writes VERSION + package.json, tests, commits to main, publishes to npm.
# Dry run is on by default: untick it for the real release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.2 (no v)"
        required: true
        type: string
      dry_run:
        description: "Dry run: do everything except push, publish and create the release"
        type: boolean
        default: true
jobs:
  publish:
    if: github.ref == 'refs/heads/main' || inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version commit, create the GitHub release
      id-token: write # npm trusted publishing (OIDC): no token or OTP stored anywhere
    steps:
      - name: Version must look like 1.2.3
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "version must be like 0.1.2 (no v), got: $VERSION"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - run: npm ci
      - name: Write VERSION and package.json
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "$VERSION" > VERSION
          npm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: npm test # rebuilds dist/ with the new version
      - name: Commit the version bump to main
        env:
          VERSION: ${{ inputs.version }}
          DRY: ${{ inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "Release $VERSION"; [ "$DRY" = true ] && echo "dry run: not pushing" || git push; }
      - run: npm publish ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: GitHub release (record only; does not trigger anything)
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" --target "$(git rev-parse HEAD)" --title "$VERSION" --generate-notes
